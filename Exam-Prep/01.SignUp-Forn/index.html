<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css" type="text/css">
</head>
<body>
    <div class="card">
        <div class="container">
            <section class="register_type">
                <div class="left"><a href="#">Sign Up</a></div>
                <div class="right"><a href="#">Log In</a></div>
            </section>
            <h2>Sign Up for Free</h2>
            <form action="#">
                <div class="entry half">
                    <input type="text" id="first_name" name="first_name">
                    <label for="first_name">First Name<span>*</span></label>
                </div>
                <div class="entry half">
                    <input type="text" id="last_name" name="last_name" >
                    <label for="first_name">Last Name<span>*</span></label>
                </div>
                <div class="entry">
                    <input type="email" id="email" name="email" >
                    <label for="first_name">Email Address<span>*</span></label>
                </div>
                <div class="entry">
                    <input type="password" id="password" name="password">
                    <label for="first_name">Set Password<span>*</span></label>
                </div>
                <button>Get Started</button>
            </form>
        </div>
    </div>
</body>
</html>
